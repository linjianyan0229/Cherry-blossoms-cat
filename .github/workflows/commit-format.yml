name: 提交标题格式检查

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  commit-format:
    name: 提交标题格式
    runs-on: ubuntu-latest
    steps:
      - name: 检查 PR 提交标题
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const format = /^[123]、(?:功能|修复|文档维护)：(?=.*\p{Script=Han}).+$/u;
            const invalid = commits
              .map(commit => commit.commit.message.split(/\r?\n/, 1)[0])
              .filter(subject => !format.test(subject));

            if (invalid.length > 0) {
              core.setFailed([
                '以下提交标题不符合格式：',
                ...invalid.map(subject => `- ${subject}`),
                '格式：1、功能：中文说明 / 2、修复：中文说明 / 3、文档维护：中文说明',
              ].join('\n'));
              return;
            }

            core.info(`检查通过：${commits.length} 条提交标题符合格式。`);

