services:
  cherry:
    image: ${CHERRY_IMAGE:?请在 .env 中设置发行镜像的完整版本或 digest}
    platform: linux/amd64
    user: '1000:1000'
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CHERRY_QQ_VERSION: ${CHERRY_QQ_VERSION:-3.2.35-54395}
    volumes:
      - runtime:/work
      - config:/work/config
      - plugins:/work/plugins
      - profile:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
    shm_size: '256m'
    pids_limit: 256
    mem_limit: '2g'
    cpus: 2.0
    ports:
      - '127.0.0.1:${CHERRY_WEBUI_PORT:-6099}:6099'
    networks:
      - cherry
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  # A new QQ build gets a new runtime copy; account data/config remain shared.
  runtime:
    name: ${COMPOSE_PROJECT_NAME:-cherry-cat-preview}-runtime-qq-${CHERRY_QQ_VERSION:-3.2.35-54395}
  config:
  plugins:
  profile:

networks:
  cherry:
    driver: bridge
